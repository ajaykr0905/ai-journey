name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  prefix-cache-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and verification tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . ruff==0.6.9 pytest==9.0.2 build==1.2.2.post1
      - name: Check physical prefix storage and legacy serving compatibility
        run: |
          ruff check src/ai_journey/prefix*.py tests/test_prefix*.py
          ruff format --check src/ai_journey/prefix*.py tests/test_prefix*.py
          python -m compileall -q src tests
          python -m pytest -q tests/test_prefix*.py tests/test_ddp_generation.py tests/test_ddp_service*.py tests/test_ddp_http*.py
      - name: Build and install isolated prefix-serving wheel
        run: |
          python -m build --outdir "$RUNNER_TEMP/prefix-dist"
          python -m pip install --no-deps --target "$RUNNER_TEMP/prefix-installed" "$RUNNER_TEMP"/prefix-dist/*.whl
      - name: Operate actual installed cold warm and branched prefix requests
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/prefix-installed
        run: |
          python -c 'import ai_journey, os; assert ai_journey.__file__.startswith(os.environ["RUNNER_TEMP"] + "/prefix-installed/")'
          python -m ai_journey.prefix_readiness --installed-root "$RUNNER_TEMP/prefix-installed" --output-dir "$RUNNER_TEMP/prefix-evidence"
          python -m ai_journey.prefix_readiness --verify-report "$RUNNER_TEMP/prefix-evidence/report.json" --artifact-dir "$RUNNER_TEMP/prefix-evidence"
      - name: Retain actual CPU prefix observations and installed package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prefix-cache-cpu-evidence
          path: |
            ${{ runner.temp }}/prefix-evidence/
            ${{ runner.temp }}/prefix-dist/
          if-no-files-found: error
  grouped-query-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      GLOO_SOCKET_IFNAME: lo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and verification tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . ruff==0.6.9 pytest==9.0.2 build==1.2.2.post1
      - name: Check grouped-query numerical cache and restart contracts
        run: |
          ruff check src/ai_journey/gqa*.py src/ai_journey/grouped_rotary_attention.py tests/test_gqa*.py tests/test_grouped_rotary_attention.py
          ruff format --check src/ai_journey/gqa*.py src/ai_journey/grouped_rotary_attention.py tests/test_gqa*.py tests/test_grouped_rotary_attention.py
          python -m compileall -q src tests
          python -m pytest -q tests/test_gqa*.py tests/test_grouped_rotary_attention.py
      - name: Build and install isolated grouped-query wheel
        run: |
          python -m build --outdir "$RUNNER_TEMP/gqa-dist"
          python -m pip install --no-deps --target "$RUNNER_TEMP/gqa-installed" "$RUNNER_TEMP"/gqa-dist/*.whl
          mkdir -p "$RUNNER_TEMP/gqa-evidence"
      - name: Operate installed dense grouped-query training and abrupt recovery
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/gqa-installed
        run: |
          export PATH="$RUNNER_TEMP/gqa-installed/bin:$PATH"
          python -c 'import ai_journey, os; assert ai_journey.__file__.startswith(os.environ["RUNNER_TEMP"] + "/gqa-installed/")'
          ai-journey-gpt2-train train --source "$GITHUB_WORKSPACE/data/day-19-demo-names.txt" --spec "$GITHUB_WORKSPACE/config/gqa-cpu-lab.json" --checkpoint "$RUNNER_TEMP/gqa-evidence/training.pt" --report "$RUNNER_TEMP/gqa-evidence/training.json"
          ai-journey-gpt2-train verify --report "$RUNNER_TEMP/gqa-evidence/training.json"
          ai-journey-gpt2-train replay --source "$GITHUB_WORKSPACE/data/day-19-demo-names.txt" --report "$RUNNER_TEMP/gqa-evidence/training.json"
          ai-journey-ddp recover-crash --source "$GITHUB_WORKSPACE/data/day-19-demo-names.txt" --spec "$GITHUB_WORKSPACE/config/gqa-cpu-lab.json" --output "$RUNNER_TEMP/gqa-evidence/recovery.json" --workdir "$RUNNER_TEMP/gqa-evidence/owned"
          ai-journey-ddp verify-crash-recovery --report "$RUNNER_TEMP/gqa-evidence/recovery.json" --workdir "$RUNNER_TEMP/gqa-evidence/owned"
      - name: Fetch immutable public source for controlled grouped-query experiments
        run: |
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/UniversalDependencies/UD_English-PUD/6e328e8195c04a297c1e375d21fe663be1ce6178/en_pud-ud-test.conllu --output "$RUNNER_TEMP/gqa-english.conllu"
      - name: Replay installed public grouped-query and physical cache observations
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/gqa-installed
        run: |
          export PATH="$RUNNER_TEMP/gqa-installed/bin:$PATH"
          ai-journey-gqa-experiment plan --output "$RUNNER_TEMP/gqa-evidence/plan.json"
          ai-journey-gqa-experiment public --source en-pud --snapshot "$RUNNER_TEMP/gqa-english.conllu" --plan "$RUNNER_TEMP/gqa-evidence/plan.json" --output "$RUNNER_TEMP/gqa-evidence/public.json"
          ai-journey-gqa-experiment verify --report "$RUNNER_TEMP/gqa-evidence/public.json"
          ai-journey-gqa-experiment replay --report "$RUNNER_TEMP/gqa-evidence/public.json" --snapshot "$RUNNER_TEMP/gqa-english.conllu"
          ai-journey-gqa-experiment cache --report "$RUNNER_TEMP/gqa-evidence/public.json" --snapshot "$RUNNER_TEMP/gqa-english.conllu" --output "$RUNNER_TEMP/gqa-evidence/cache.json"
          ai-journey-gqa-experiment cache-verify --report "$RUNNER_TEMP/gqa-evidence/cache.json"
          ai-journey-gqa-experiment cache-replay --report "$RUNNER_TEMP/gqa-evidence/cache.json" --snapshot "$RUNNER_TEMP/gqa-english.conllu"
      - name: Retain actual grouped-query CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grouped-query-cpu-evidence
          path: |
            ${{ runner.temp }}/gqa-evidence/
            ${{ runner.temp }}/gqa-dist/
          if-no-files-found: error
  moe-cpu-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      GLOO_SOCKET_IFNAME: lo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and pinned verification tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . ruff==0.6.9 pytest==9.0.2 build==1.2.2.post1
      - name: Check routing training restart and semantic evidence contracts
        run: |
          ruff check src/ai_journey/moe*.py tests/test_moe*.py
          ruff format --check src/ai_journey/moe*.py tests/test_moe*.py
          ruff check src/ai_journey/checkpoint*.py src/ai_journey/training_optimizer_state.py tests/test_checkpoint*.py tests/test_serialized_optimizer_admission.py tests/test_training_optimizer_counters.py
          ruff format --check src/ai_journey/checkpoint*.py src/ai_journey/training_optimizer_state.py tests/test_checkpoint*.py tests/test_serialized_optimizer_admission.py tests/test_training_optimizer_counters.py
          python -m compileall -q src tests
          python -m pytest -q tests/test_moe*.py tests/test_checkpoint*.py tests/test_serialized_optimizer_admission.py tests/test_training_optimizer_counters.py tests/test_decoder_document_schedule_admission.py tests/test_document_evaluation_streaming.py tests/test_document_evaluation_finite.py
      - name: Build and install isolated MoE wheel
        run: |
          python -m build --outdir "$RUNNER_TEMP/moe-dist"
          python -m pip install --no-deps --target "$RUNNER_TEMP/moe-installed" "$RUNNER_TEMP"/moe-dist/*.whl
      - name: Fetch immutable public English PUD snapshot
        run: |
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/UniversalDependencies/UD_English-PUD/6e328e8195c04a297c1e375d21fe663be1ce6178/en_pud-ud-test.conllu --output "$RUNNER_TEMP/moe-english.conllu"
          mkdir -p "$RUNNER_TEMP/moe-evidence"
      - name: Run installed public experiment and independently replay observations
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/moe-installed
        run: |
          export PATH="$RUNNER_TEMP/moe-installed/bin:$PATH"
          python -c 'import ai_journey, os; assert ai_journey.__file__.startswith(os.environ["RUNNER_TEMP"] + "/moe-installed/")'
          ai-journey-moe-experiment plan --output "$RUNNER_TEMP/moe-evidence/plan.json"
          ai-journey-moe-experiment public --source en-pud --snapshot "$RUNNER_TEMP/moe-english.conllu" --plan "$RUNNER_TEMP/moe-evidence/plan.json" --output "$RUNNER_TEMP/moe-evidence/report.json"
          ai-journey-moe-experiment verify --report "$RUNNER_TEMP/moe-evidence/report.json"
          ai-journey-moe-experiment replay --report "$RUNNER_TEMP/moe-evidence/report.json" --snapshot "$RUNNER_TEMP/moe-english.conllu"
          python -m ai_journey.checkpoint_journal_readiness --installed-root "$RUNNER_TEMP/moe-installed" --repository "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/moe-evidence/journal"
      - name: Prove installed replicated expert restart from public bytes
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/moe-installed
        run: |
          python -m ai_journey.moe_ddp_readiness --installed-root "$RUNNER_TEMP/moe-installed" --repository "$GITHUB_WORKSPACE" --output-dir "$RUNNER_TEMP/moe-evidence/replicated"
      - name: Retain measured public CPU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moe-public-cpu-evidence
          path: |
            ${{ runner.temp }}/moe-evidence/
            ${{ runner.temp }}/moe-dist/
          if-no-files-found: error
  nvidia-preflight-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU contract and build tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . ruff==0.6.9 pytest==9.0.2 build==1.2.2.post1
      - name: Check NVIDIA preflight contracts without GPU execution
        run: |
          ruff check src/ai_journey/gpu*.py tests/test_gpu*.py
          ruff format --check src/ai_journey/gpu*.py tests/test_gpu*.py
          python -m compileall -q src/ai_journey/gpu*.py tests/test_gpu*.py
          python -m pytest -q tests/test_gpu*.py
      - name: Build and install isolated wheel
        run: |
          python -m build --outdir "$RUNNER_TEMP/nvidia-dist"
          python -m pip install --no-deps --target "$RUNNER_TEMP/nvidia-installed" "$RUNNER_TEMP"/nvidia-dist/*.whl
      - name: Run installed probe plan collect and verify integrity smoke
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/nvidia-installed
        run: |
          python -m ai_journey.gpu_preflight_readiness --installed-root "$RUNNER_TEMP/nvidia-installed" --resource-config "$GITHUB_WORKSPACE/config/day-51-resource-plan.json" --output-dir "$RUNNER_TEMP/nvidia-evidence" --expect-blocked
      - name: Retain blocked host and installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-preflight-cpu-integrity
          path: |
            ${{ runner.temp }}/nvidia-evidence/
            ${{ runner.temp }}/nvidia-dist/
          if-no-files-found: error
  distributed-cpu-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
      GLOO_SOCKET_IFNAME: lo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and package
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . ruff==0.6.9 pytest==9.0.2
      - name: Check distributed lab contracts and real worker regressions
        run: |
          ruff check src/ai_journey/ddp*.py tests/test_ddp*.py
          ruff format --check src/ai_journey/ddp*.py tests/test_ddp*.py
          python -m compileall -q src tests
          python -m pytest -q tests/test_ddp*.py
      - name: Check modern inference and observability integration
        run: |
          sources=(src/ai_journey/serving_metrics.py src/ai_journey/trace_context.py)
          tests=(tests/test_modern_ddp.py tests/test_modern_serving_cache.py tests/test_serving_metrics.py tests/test_trace_context.py)
          ruff check "${sources[@]}" "${tests[@]}"
          ruff format --check "${sources[@]}" "${tests[@]}"
          python -m pytest -q "${tests[@]}"
      - name: Gate HTTP measurements and installed loopback readiness
        run: |
          ruff check src/ai_journey/http_*.py tests/test_http_*.py
          ruff format --check src/ai_journey/http_*.py tests/test_http_*.py
          python -m pytest -q tests/test_http_*.py
          ai-journey-http-load readiness --output /tmp/ddp-ci/http-load-readiness.json
          ai-journey-http-load verify --report /tmp/ddp-ci/http-load-readiness.json
      - name: Verify published controls and reproduce installed commands
        run: |
          ai-journey-ddp verify-comparison --report artifacts/ddp-lab-2026-10-22/comparison.json
          ai-journey-ddp train --source data/day-19-demo-names.txt --spec config/ddp-lab.json --checkpoint /tmp/ddp-ci/state.pt --output /tmp/ddp-ci/training.json --workdir /tmp/ddp-ci/train --steps 4
          ai-journey-ddp verify --report /tmp/ddp-ci/training.json
          ai-journey-ddp recover --source data/day-19-demo-names.txt --spec config/ddp-lab.json --output /tmp/ddp-ci/recovery.json --workdir /tmp/ddp-ci/recovery --steps 2
          ai-journey-ddp matrix --source data/day-19-demo-names.txt --spec config/ddp-lab.json --output /tmp/ddp-ci/comparison.json --workdir /tmp/ddp-ci/matrix --steps 4
          ai-journey-ddp pipeline --source data/day-19-demo-names.txt --spec config/ddp-lab.json --output /tmp/ddp-ci/pipeline.json --workdir /tmp/ddp-ci/pipeline --steps 4
      - name: Retain measured CPU acceptance reports
        uses: actions/upload-artifact@v4
        with:
          name: distributed-cpu-evidence
          path: /tmp/ddp-ci/*.json
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Install pinned static checker
        run: python -m pip install ruff==0.6.9 pytest==9.0.2
      - name: Check transformer reliability source and tests
        run: |
          ruff check src/ai_journey/transformer_lab.py src/ai_journey/transformer_cache.py src/ai_journey/attention_audit.py src/ai_journey/transformer_certification.py src/ai_journey/transformer_evidence.py src/ai_journey/day37_cli.py src/ai_journey/ablation_protocol.py scripts/run_day_37.py tests/test_transformer_attention_contracts.py tests/test_transformer_block_controls.py tests/test_transformer_cache.py tests/test_transformer_cache_restart.py tests/test_attention_audit.py tests/test_transformer_certification.py tests/test_transformer_evidence.py tests/test_run_day_37.py tests/test_day37_head_ablation.py tests/test_ablation_config_compatibility.py
          ruff format --check src/ai_journey/transformer_lab.py src/ai_journey/transformer_cache.py src/ai_journey/attention_audit.py src/ai_journey/transformer_certification.py src/ai_journey/transformer_evidence.py src/ai_journey/day37_cli.py src/ai_journey/ablation_protocol.py scripts/run_day_37.py tests/test_transformer_attention_contracts.py tests/test_transformer_block_controls.py tests/test_transformer_cache.py tests/test_transformer_cache_restart.py tests/test_attention_audit.py tests/test_transformer_certification.py tests/test_transformer_evidence.py tests/test_run_day_37.py tests/test_day37_head_ablation.py tests/test_ablation_config_compatibility.py
          python -m compileall -q src scripts tests tools
          ruff check tests/test_transformer_padded_batches.py
          ruff format --check tests/test_transformer_padded_batches.py
          ruff check tests/test_transformer_fingerprint_dtypes.py
          ruff format --check tests/test_transformer_fingerprint_dtypes.py
          ruff check src/ai_journey/serving_benchmark.py tests/test_serving_benchmark.py
          ruff format --check src/ai_journey/serving_benchmark.py tests/test_serving_benchmark.py
          ruff check src/ai_journey/day38_training.py src/ai_journey/day38_cli.py tests/test_day38_training.py tests/test_run_day_38.py
          ruff format --check src/ai_journey/day38_training.py src/ai_journey/day38_cli.py tests/test_day38_training.py tests/test_run_day_38.py
          ruff check src/ai_journey/day38_serving.py src/ai_journey/day38_inference_cli.py src/ai_journey/day38_ablation.py tests/test_day38_serving.py tests/test_day38_ablation.py tests/test_transformer_runtime_safety.py
          ruff format --check src/ai_journey/day38_serving.py src/ai_journey/day38_inference_cli.py src/ai_journey/day38_ablation.py tests/test_day38_serving.py tests/test_day38_ablation.py tests/test_transformer_runtime_safety.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check GPT-2 interoperability contracts
        run: |
          ruff check src/ai_journey/gpt2*.py tests/test_gpt2*.py
          ruff format --check src/ai_journey/gpt2*.py tests/test_gpt2*.py
          python -m pytest -q tests/test_gpt2*.py
          ai-journey-gpt2 --help
      - name: Check opt-in decoder architecture and CPU comparison CLI
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          sources=(
            src/ai_journey/decoder_variant*.py
            src/ai_journey/modern_architecture.py
            src/ai_journey/swiglu.py
            src/ai_journey/rope.py
            src/ai_journey/rotary_attention.py
          )
          tests=(
            tests/test_decoder_variant*.py
            tests/test_modern_architecture.py
            tests/test_swiglu.py
            tests/test_rope.py
            tests/test_rotary_attention.py
          )
          ruff check "${sources[@]}" "${tests[@]}"
          ruff format --check "${sources[@]}" "${tests[@]}"
          python -m pytest -q "${tests[@]}"
          ai-journey-decoder-compare --help
      - name: Check architecture-aware training and restart safety
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          ruff check src/ai_journey/training_artifact.py src/ai_journey/training_models.py src/ai_journey/training_optimizer_state.py src/ai_journey/training_paths.py src/ai_journey/checkpoint_archive.py tests/test_training_restart_contracts.py tests/test_training_models.py tests/test_modern_training.py
          ruff format --check src/ai_journey/training_artifact.py src/ai_journey/training_models.py src/ai_journey/training_optimizer_state.py src/ai_journey/training_paths.py src/ai_journey/checkpoint_archive.py tests/test_training_restart_contracts.py tests/test_training_models.py tests/test_modern_training.py
          python -m pytest -q tests/test_training_restart_contracts.py tests/test_training_models.py tests/test_modern_training.py tests/test_gpt2_training_cli.py tests/test_gpt2_training_artifact.py
      - name: Replay verified GPT-2 training controls
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          ai-journey-gpt2-train verify --report artifacts/gpt2-training-2026-10-21/training-evidence.json
          ai-journey-gpt2-train train --source data/day-19-demo-names.txt --spec config/gpt2-training.json --checkpoint /tmp/gpt2-training.pt --report /tmp/gpt2-training.json
          ai-journey-gpt2-train replay --source data/day-19-demo-names.txt --report /tmp/gpt2-training.json
      - name: Check bounded HellaSwag evaluation contracts
        run: |
          ruff check src/ai_journey/hellaswag*.py tests/test_hellaswag*.py
          ruff format --check src/ai_journey/hellaswag*.py tests/test_hellaswag*.py
          python -m pytest -q tests/test_hellaswag*.py
      - name: Reproduce the pinned HellaSwag validation slice
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          curl --fail --location --retry 2 --max-time 60 'https://datasets-server.huggingface.co/first-rows?dataset=Rowan%2Fhellaswag&config=default&split=validation' --output /tmp/hellaswag-first-rows.json
          ai-journey-hellaswag evaluate --dataset-response /tmp/hellaswag-first-rows.json --protocol config/hellaswag-validation.json --source data/day-19-demo-names.txt --spec config/ddp-lab.json --output /tmp/hellaswag-evidence.json
          ai-journey-hellaswag verify --report /tmp/hellaswag-evidence.json
      - name: Check low-rank adapter source and numerical oracles
        run: |
          ruff check src/ai_journey/lora*.py tests/test_lora*.py
          ruff format --check src/ai_journey/lora*.py tests/test_lora*.py
      - name: Compare and replay low-rank adaptation against full fine-tuning
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          ai-journey-lora-compare --config config/lora-comparison.json --output /tmp/ai-journey-artifacts/lora-comparison.json
          ai-journey-lora-verify --report /tmp/ai-journey-artifacts/lora-comparison.json
      - name: Check assistant-only chat SFT source and tests
        run: |
          ruff check src/ai_journey/sft*.py tests/test_sft*.py
          ruff format --check src/ai_journey/sft*.py tests/test_sft*.py
      - name: Compare and replay assistant-only chat SFT
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          ai-journey-chat-sft-compare --config config/chat-sft-comparison.json --output /tmp/ai-journey-artifacts/chat-sft-comparison.json
          ai-journey-chat-sft-verify --report /tmp/ai-journey-artifacts/chat-sft-comparison.json
      - name: Check preference optimization source and tests
        run: |
          ruff check src/ai_journey/preference*.py tests/test_preference*.py
          ruff format --check src/ai_journey/preference*.py tests/test_preference*.py
          python -m pytest -q tests/test_preference*.py
      - name: Compare and replay grouped preference optimization
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          ai-journey-preference-compare --config config/preference-comparison.json --output /tmp/ai-journey-artifacts/preference-comparison.json
          ai-journey-preference-verify --report /tmp/ai-journey-artifacts/preference-comparison.json
      - name: Check analytical resource accounting contracts
        run: |
          ruff check src/ai_journey/resource*.py tests/test_resource*.py
          ruff format --check src/ai_journey/resource*.py tests/test_resource*.py
          python -m pytest -q tests/test_resource*.py
      - name: Recompute and verify the pinned 7B resource plan
        run: |
          ai-journey-resource-plan --config config/day-51-resource-plan.json --output /tmp/ai-journey-artifacts/day-51-resource-plan.json
          ai-journey-resource-verify --report /tmp/ai-journey-artifacts/day-51-resource-plan.json
      - name: Check analytical decoder roofline contracts
        run: |
          ruff check src/ai_journey/roofline*.py tests/test_roofline*.py
          ruff format --check src/ai_journey/roofline*.py tests/test_roofline*.py
          python -m pytest -q tests/test_roofline*.py
      - name: Recompute and verify the pinned Day 55 roofline
        run: |
          ai-journey-roofline build --config config/day-55-roofline-plan.json --output /tmp/ai-journey-artifacts/day-55-roofline-report.json
          ai-journey-roofline verify --report /tmp/ai-journey-artifacts/day-55-roofline-report.json
      - name: Check BPE source tests and pipeline formatting
        run: |
          ruff check src/ai_journey/bpe*.py src/ai_journey/token*.py src/ai_journey/parallel*.py src/ai_journey/export_verification.py src/ai_journey/day40_cli.py tests/test_bpe*.py tests/test_tokenizer*.py tests/test_parallel*.py tests/test_export_verification.py tests/test_run_day_40.py scripts/verify_bpe_lab.py
          ruff format --check src/ai_journey/bpe*.py src/ai_journey/token*.py src/ai_journey/parallel*.py src/ai_journey/export_verification.py src/ai_journey/day40_cli.py tests/test_bpe*.py tests/test_tokenizer*.py tests/test_parallel*.py tests/test_export_verification.py tests/test_run_day_40.py scripts/verify_bpe_lab.py
      - name: Fetch immutable public BPE snapshots
        run: |
          mkdir -p /tmp/ai-journey-artifacts/bpe-sources
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/UniversalDependencies/UD_Hindi-PUD/33e5ecd280d97c7b744993a1e12230559c94fc89/hi_pud-ud-test.conllu --output /tmp/ai-journey-artifacts/bpe-sources/hindi.conllu
          curl --fail --location --retry 2 --max-time 60 https://raw.githubusercontent.com/UniversalDependencies/UD_English-PUD/6e328e8195c04a297c1e375d21fe663be1ce6178/en_pud-ud-test.conllu --output /tmp/ai-journey-artifacts/bpe-sources/english.conllu
      - name: Certify BPE public-data restart and paired serving
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: >-
          python scripts/verify_bpe_lab.py
          --hindi /tmp/ai-journey-artifacts/bpe-sources/hindi.conllu
          --english /tmp/ai-journey-artifacts/bpe-sources/english.conllu
          --artifact-dir /tmp/ai-journey-artifacts/bpe
      - name: Compare decoder vocabulary budgets on pinned public text
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          ai-journey-bpe-model-compare --hindi /tmp/ai-journey-artifacts/bpe-sources/hindi.conllu --english /tmp/ai-journey-artifacts/bpe-sources/english.conllu --protocol config/day-41-vocabulary-ablation.json --output /tmp/ai-journey-artifacts/bpe/model-comparison.json
          ai-journey-bpe-model-verify --report /tmp/ai-journey-artifacts/bpe/model-comparison.json --hindi /tmp/ai-journey-artifacts/bpe-sources/hindi.conllu --english /tmp/ai-journey-artifacts/bpe-sources/english.conllu
      - name: Run Days 0-11
        run: python scripts/run_days_00_11.py --artifact-dir /tmp/ai-journey-artifacts
      - name: Run Day 12 shape validation
        run: python scripts/run_day_12.py --output /tmp/ai-journey-artifacts/day-12-gpt-shapes.md
      - name: Run Day 13 attention validation
        run: >-
          python scripts/run_day_13.py
          --output /tmp/ai-journey-artifacts/day-13-attention.md
          --json-output /tmp/ai-journey-artifacts/day-13-attention.json
      - name: Run Day 14 MLP memory validation
        run: >-
          python scripts/run_day_14.py
          --output /tmp/ai-journey-artifacts/day-14-mlp-memory.md
          --json-output /tmp/ai-journey-artifacts/day-14-mlp-memory.json
      - name: Run Day 15 scalar autodiff validation
        run: >-
          python scripts/run_day_15.py
          --output /tmp/ai-journey-artifacts/day-15-scalar-autodiff.md
          --json-output /tmp/ai-journey-artifacts/day-15-scalar-autodiff.json
      - name: Run Day 16 manual backprop validation
        run: >-
          python scripts/run_day_16.py
          --output /tmp/ai-journey-artifacts/day-16-manual-backprop.md
          --json-output /tmp/ai-journey-artifacts/day-16-manual-backprop.json
      - name: Run Day 17 scalar MLP validation
        run: >-
          python scripts/run_day_17.py
          --output /tmp/ai-journey-artifacts/day-17-scalar-mlp.md
          --json-output /tmp/ai-journey-artifacts/day-17-scalar-mlp.json
      - name: Run Day 19 character bigram validation
        run: >-
          python scripts/run_day_19.py
          --output /tmp/ai-journey-artifacts/day-19-bigram.md
          --json-output /tmp/ai-journey-artifacts/day-19-bigram.json
          --manifest-output /tmp/ai-journey-artifacts/day-19-corpus-manifest.json
      - name: Run Day 20 neural bigram validation
        run: >-
          python scripts/run_day_20.py
          --output /tmp/ai-journey-artifacts/day-20-neural-bigram.md
          --json-output /tmp/ai-journey-artifacts/day-20-neural-bigram.json
      - name: Enforce corpus shift policy
        run: >-
          python scripts/check_corpus_shift.py
          --baseline data/day-19-demo-names.txt
          --candidate data/day-21-indian-cities.txt
          --max-js-divergence 0.05
          --max-perplexity-ratio 2.5
          --output /tmp/ai-journey-artifacts/corpus-shift.json
      - name: Train and checkpoint context MLP
        run: >-
          python scripts/train_context_mlp.py
          --corpus data/day-19-demo-names.txt
          --steps 10
          --seed 22
          --output /tmp/ai-journey-artifacts/context-mlp.json
          --checkpoint /tmp/ai-journey-artifacts/context-mlp-checkpoint.json
      - name: Run Day 23 model selection
        run: >-
          python scripts/run_day_23.py
          --corpus data/day-19-demo-names.txt
          --epochs 3
          --batch-size 16
          --rate-count 3
          --output /tmp/ai-journey-artifacts/day-23-model-selection.json
          --checkpoint /tmp/ai-journey-artifacts/day-23-context-mlp.json
          --plot /tmp/ai-journey-artifacts/day-23-learning-rate-sweep.svg
      - name: Train and checkpoint the Day 24 transformer
        run: >-
          python scripts/run_day_24.py
          --corpus data/day-19-demo-names.txt
          --steps 5
          --batch-size 4
          --block-size 4
          --embedding-dim 8
          --heads 2
          --layers 1
          --output /tmp/ai-journey-artifacts/day-24-transformer.json
          --checkpoint /tmp/ai-journey-artifacts/day-24-transformer.pt
      - name: Verify the Day 24 overfit capacity gate
        run: >-
          python scripts/check_day_24_overfit.py
          --corpus data/day-19-demo-names.txt
          --examples 10
          --steps 20
          --batch-size 5
          --embedding-dim 8
          --heads 2
          --layers 1
          --output /tmp/ai-journey-artifacts/day-24-overfit.json
      - name: Compare Day 25 activation and gradient health
        run: >-
          python scripts/run_day_25.py
          --corpus data/day-19-demo-names.txt
          --steps 2
          --batch-size 4
          --block-size 4
          --embedding-dim 8
          --heads 2
          --layers 1
          --stressed-initialization-std 0.8
          --output /tmp/ai-journey-artifacts/day-25-diagnostics.json
          --plot /tmp/ai-journey-artifacts/day-25-activations.svg
          --gradient-plot /tmp/ai-journey-artifacts/day-25-gradients.svg
      - name: Compare Day 26 fixed-normal and Kaiming loss curves
        run: >-
          python scripts/run_day_26.py
          --corpus data/day-19-demo-names.txt
          --steps 10
          --batch-size 8
          --block-size 8
          --embedding-dim 16
          --heads 4
          --layers 1
          --kaiming-gain 1.0
          --output /tmp/ai-journey-artifacts/day-26-kaiming.json
          --loss-plot /tmp/ai-journey-artifacts/day-26-loss-curves.svg
          --audit-plot /tmp/ai-journey-artifacts/day-26-initialization.svg
      - name: Verify the Day 27 BatchNorm mode trap
        run: >-
          python scripts/run_day_27.py
          --corpus data/day-19-demo-names.txt
          --steps 10
          --batch-size 8
          --block-size 8
          --embedding-dim 16
          --heads 4
          --layers 1
          --output /tmp/ai-journey-artifacts/day-27-batchnorm.json
          --plot /tmp/ai-journey-artifacts/day-27-batchnorm.svg
      - name: Verify manual loss and transformer parameter gradients
        run: >-
          python scripts/run_day_28.py
          --output /tmp/ai-journey-artifacts/day-28-gradient-audit.json
      - name: Verify manual BatchNorm backward gradients
        run: >-
          python scripts/check_batchnorm_backward.py
          --output /tmp/ai-journey-artifacts/batchnorm-backward.json
      - name: Run the predeclared transformer ablation
        run: >-
          python scripts/run_ablation.py
          --protocol config/day-31-learning-rate-ablation.json
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-31-ablation.json
      - name: Run the Day 32 hierarchical character model
        run: >-
          python scripts/run_day_32.py
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-32-wavenet.json
          --steps 4
          --batch-size 8
          --context-size 4
          --embedding-dim 4
          --hidden-dim 12
          --group-factors 2 2
          --overfit-examples 8
          --overfit-steps 40
          --minimum-overfit-improvement 0.5
      - name: Verify the Day 33 primitive WaveNet rebuild
        run: >-
          python scripts/run_day_33.py
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-33-wavenet-rebuild.json
          --steps 2
          --batch-size 8
          --context-size 4
          --embedding-dim 4
          --hidden-dim 12
          --group-factors 2 2
          --overfit-examples 8
          --overfit-steps 30
          --minimum-overfit-improvement 0.3
      - name: Certify the Day 33 rebuild reliability contract
        run: >-
          python scripts/certify_day_33.py
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-33-certification.json
          --examples 4
      - name: Train the pinned Tiny Shakespeare bigram baseline
        run: >-
          ai-journey-day-34
          --corpus /tmp/ai-journey-artifacts/tinyshakespeare.txt
          --download
          --output /tmp/ai-journey-artifacts/day-34-bigram.json
          --checkpoint /tmp/ai-journey-artifacts/day-34-bigram.pt
          --steps 2
          --batch-size 4
          --block-size 8
          --sample-tokens 16
      - name: Verify causal averaging equivalence and streaming
        run: >-
          ai-journey-day-35
          --output /tmp/ai-journey-artifacts/day-35-causal-average.json
          --batch-size 2
          --time 5
          --channels 3
      - name: Train and replay the Day 38 full transformer
        run: >-
          ai-journey-day-38
          --corpus /tmp/ai-journey-artifacts/tinyshakespeare.txt
          --output /tmp/ai-journey-artifacts/day-38-transformer.json
          --checkpoint /tmp/ai-journey-artifacts/day-38-transformer.pt
          --steps 2
          --batch-size 4
          --block-size 8
          --embedding-dim 8
          --heads 2
          --layers 1
          --train-token-limit 320
          --validation-token-limit 80
          --sample-tokens 16
          --sample-top-k 5
      - name: Audit and serve the trained Day 38 checkpoint
        run: |
          for operation in audit generate benchmark; do
            ai-journey-day-38-infer \
              --report /tmp/ai-journey-artifacts/day-38-transformer.json \
              --checkpoint /tmp/ai-journey-artifacts/day-38-transformer.pt \
              --corpus /tmp/ai-journey-artifacts/tinyshakespeare.txt \
              --operation "$operation" --new-tokens 4 \
              --output "/tmp/ai-journey-artifacts/day-38-$operation.json"
          done
      - name: Run paired public-data dropout controls
        run: >-
          ai-journey-day-38-ablate
          --corpus /tmp/ai-journey-artifacts/tinyshakespeare.txt
          --protocol config/day-38-dropout-ablation.json
          --train-tokens 320
          --validation-tokens 80
          --output /tmp/ai-journey-artifacts/day-38-dropout.json
      - name: Check deployment readiness
        run: >-
          python tools/deployment_readiness_check.py
          --root .
          --config config/deployment_readiness.json
          --output /tmp/deployment-readiness.json
      - name: Certify manual attention and matched head-count trials
        run: >-
          ai-journey-day-37
          --output /tmp/ai-journey-artifacts/day-37-certification.json
          --protocol config/day-37-head-count-ablation.json
          --corpus data/day-19-demo-names.txt
          --ablation-output /tmp/ai-journey-artifacts/day-37-head-count.json
      - name: Certify post-norm scaled dot-product attention
        run: >-
          ai-journey-day-37
          --output /tmp/ai-journey-artifacts/day-37-post-sdpa.json
          --backend sdpa
          --norm-placement post
      - name: Benchmark bounded CPU generation with exact output parity
        run: >-
          ai-journey-serving-benchmark
          --output /tmp/ai-journey-artifacts/serving-benchmark.json
  distributed-capacity-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU runtime and pinned verification tools
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.24,<2"
          python -m pip install -e . --no-deps
          python -m pip install ruff==0.6.9 pytest==9.0.2 build==1.2.2.post1
      - name: Check analytical distributed capacity contracts
        run: |
          ruff check src/ai_journey/distributed_capacity*.py src/ai_journey/fsdp_planning.py src/ai_journey/checkpoint_planning.py tests/test_distributed_capacity*.py tests/test_fsdp_planning.py tests/test_checkpoint_planning.py
          ruff format --check src/ai_journey/distributed_capacity*.py src/ai_journey/fsdp_planning.py src/ai_journey/checkpoint_planning.py tests/test_distributed_capacity*.py tests/test_fsdp_planning.py tests/test_checkpoint_planning.py
          python -m compileall -q src tests
          python -m pytest -q tests/test_distributed_capacity*.py tests/test_fsdp_planning.py tests/test_checkpoint_planning.py
      - name: Build and install an isolated capacity-planning wheel
        run: |
          python -m build --outdir "$RUNNER_TEMP/capacity-dist"
          python -m pip install --no-deps --target "$RUNNER_TEMP/capacity-installed" "$RUNNER_TEMP"/capacity-dist/*.whl
          mkdir -p "$RUNNER_TEMP/capacity-evidence"
      - name: Build and independently verify installed analytical evidence
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/capacity-installed
        run: |
          export PATH="$RUNNER_TEMP/capacity-installed/bin:$PATH"
          ai-journey-distributed-capacity build --config "$GITHUB_WORKSPACE/config/day-55-distributed-capacity.json" --output "$RUNNER_TEMP/capacity-evidence/report.json"
          ai-journey-distributed-capacity verify --report "$RUNNER_TEMP/capacity-evidence/report.json"
      - name: Retain analytical capacity evidence and installed package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-capacity-evidence
          path: |
            ${{ runner.temp }}/capacity-evidence/
            ${{ runner.temp }}/capacity-dist/
          if-no-files-found: error
