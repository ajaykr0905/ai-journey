name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Days 0-11
        run: python scripts/run_days_00_11.py --artifact-dir /tmp/ai-journey-artifacts
      - name: Run Day 12 shape validation
        run: python scripts/run_day_12.py --output /tmp/ai-journey-artifacts/day-12-gpt-shapes.md
      - name: Check deployment readiness
        run: >-
          python tools/deployment_readiness_check.py
          --root .
          --config config/deployment_readiness.json
          --output /tmp/deployment-readiness.json
