name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e .
      - name: Install pinned static checker
        run: python -m pip install ruff==0.6.9
      - name: Check transformer reliability source and tests
        run: |
          ruff check src/ai_journey/transformer_lab.py src/ai_journey/transformer_cache.py src/ai_journey/attention_audit.py src/ai_journey/transformer_certification.py src/ai_journey/transformer_evidence.py src/ai_journey/day37_cli.py src/ai_journey/ablation_protocol.py scripts/run_day_37.py tests/test_transformer_attention_contracts.py tests/test_transformer_block_controls.py tests/test_transformer_cache.py tests/test_transformer_cache_restart.py tests/test_attention_audit.py tests/test_transformer_certification.py tests/test_transformer_evidence.py tests/test_run_day_37.py tests/test_day37_head_ablation.py tests/test_ablation_config_compatibility.py
          ruff format --check src/ai_journey/transformer_lab.py src/ai_journey/transformer_cache.py src/ai_journey/attention_audit.py src/ai_journey/transformer_certification.py src/ai_journey/transformer_evidence.py src/ai_journey/day37_cli.py src/ai_journey/ablation_protocol.py scripts/run_day_37.py tests/test_transformer_attention_contracts.py tests/test_transformer_block_controls.py tests/test_transformer_cache.py tests/test_transformer_cache_restart.py tests/test_attention_audit.py tests/test_transformer_certification.py tests/test_transformer_evidence.py tests/test_run_day_37.py tests/test_day37_head_ablation.py tests/test_ablation_config_compatibility.py
          python -m compileall -q src scripts tests tools
          ruff check tests/test_transformer_padded_batches.py
          ruff format --check tests/test_transformer_padded_batches.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run Days 0-11
        run: python scripts/run_days_00_11.py --artifact-dir /tmp/ai-journey-artifacts
      - name: Run Day 12 shape validation
        run: python scripts/run_day_12.py --output /tmp/ai-journey-artifacts/day-12-gpt-shapes.md
      - name: Run Day 13 attention validation
        run: >-
          python scripts/run_day_13.py
          --output /tmp/ai-journey-artifacts/day-13-attention.md
          --json-output /tmp/ai-journey-artifacts/day-13-attention.json
      - name: Run Day 14 MLP memory validation
        run: >-
          python scripts/run_day_14.py
          --output /tmp/ai-journey-artifacts/day-14-mlp-memory.md
          --json-output /tmp/ai-journey-artifacts/day-14-mlp-memory.json
      - name: Run Day 15 scalar autodiff validation
        run: >-
          python scripts/run_day_15.py
          --output /tmp/ai-journey-artifacts/day-15-scalar-autodiff.md
          --json-output /tmp/ai-journey-artifacts/day-15-scalar-autodiff.json
      - name: Run Day 16 manual backprop validation
        run: >-
          python scripts/run_day_16.py
          --output /tmp/ai-journey-artifacts/day-16-manual-backprop.md
          --json-output /tmp/ai-journey-artifacts/day-16-manual-backprop.json
      - name: Run Day 17 scalar MLP validation
        run: >-
          python scripts/run_day_17.py
          --output /tmp/ai-journey-artifacts/day-17-scalar-mlp.md
          --json-output /tmp/ai-journey-artifacts/day-17-scalar-mlp.json
      - name: Run Day 19 character bigram validation
        run: >-
          python scripts/run_day_19.py
          --output /tmp/ai-journey-artifacts/day-19-bigram.md
          --json-output /tmp/ai-journey-artifacts/day-19-bigram.json
          --manifest-output /tmp/ai-journey-artifacts/day-19-corpus-manifest.json
      - name: Run Day 20 neural bigram validation
        run: >-
          python scripts/run_day_20.py
          --output /tmp/ai-journey-artifacts/day-20-neural-bigram.md
          --json-output /tmp/ai-journey-artifacts/day-20-neural-bigram.json
      - name: Enforce corpus shift policy
        run: >-
          python scripts/check_corpus_shift.py
          --baseline data/day-19-demo-names.txt
          --candidate data/day-21-indian-cities.txt
          --max-js-divergence 0.05
          --max-perplexity-ratio 2.5
          --output /tmp/ai-journey-artifacts/corpus-shift.json
      - name: Train and checkpoint context MLP
        run: >-
          python scripts/train_context_mlp.py
          --corpus data/day-19-demo-names.txt
          --steps 10
          --seed 22
          --output /tmp/ai-journey-artifacts/context-mlp.json
          --checkpoint /tmp/ai-journey-artifacts/context-mlp-checkpoint.json
      - name: Run Day 23 model selection
        run: >-
          python scripts/run_day_23.py
          --corpus data/day-19-demo-names.txt
          --epochs 3
          --batch-size 16
          --rate-count 3
          --output /tmp/ai-journey-artifacts/day-23-model-selection.json
          --checkpoint /tmp/ai-journey-artifacts/day-23-context-mlp.json
          --plot /tmp/ai-journey-artifacts/day-23-learning-rate-sweep.svg
      - name: Train and checkpoint the Day 24 transformer
        run: >-
          python scripts/run_day_24.py
          --corpus data/day-19-demo-names.txt
          --steps 5
          --batch-size 4
          --block-size 4
          --embedding-dim 8
          --heads 2
          --layers 1
          --output /tmp/ai-journey-artifacts/day-24-transformer.json
          --checkpoint /tmp/ai-journey-artifacts/day-24-transformer.pt
      - name: Verify the Day 24 overfit capacity gate
        run: >-
          python scripts/check_day_24_overfit.py
          --corpus data/day-19-demo-names.txt
          --examples 10
          --steps 20
          --batch-size 5
          --embedding-dim 8
          --heads 2
          --layers 1
          --output /tmp/ai-journey-artifacts/day-24-overfit.json
      - name: Compare Day 25 activation and gradient health
        run: >-
          python scripts/run_day_25.py
          --corpus data/day-19-demo-names.txt
          --steps 2
          --batch-size 4
          --block-size 4
          --embedding-dim 8
          --heads 2
          --layers 1
          --stressed-initialization-std 0.8
          --output /tmp/ai-journey-artifacts/day-25-diagnostics.json
          --plot /tmp/ai-journey-artifacts/day-25-activations.svg
          --gradient-plot /tmp/ai-journey-artifacts/day-25-gradients.svg
      - name: Compare Day 26 fixed-normal and Kaiming loss curves
        run: >-
          python scripts/run_day_26.py
          --corpus data/day-19-demo-names.txt
          --steps 10
          --batch-size 8
          --block-size 8
          --embedding-dim 16
          --heads 4
          --layers 1
          --kaiming-gain 1.0
          --output /tmp/ai-journey-artifacts/day-26-kaiming.json
          --loss-plot /tmp/ai-journey-artifacts/day-26-loss-curves.svg
          --audit-plot /tmp/ai-journey-artifacts/day-26-initialization.svg
      - name: Verify the Day 27 BatchNorm mode trap
        run: >-
          python scripts/run_day_27.py
          --corpus data/day-19-demo-names.txt
          --steps 10
          --batch-size 8
          --block-size 8
          --embedding-dim 16
          --heads 4
          --layers 1
          --output /tmp/ai-journey-artifacts/day-27-batchnorm.json
          --plot /tmp/ai-journey-artifacts/day-27-batchnorm.svg
      - name: Verify manual loss and transformer parameter gradients
        run: >-
          python scripts/run_day_28.py
          --output /tmp/ai-journey-artifacts/day-28-gradient-audit.json
      - name: Verify manual BatchNorm backward gradients
        run: >-
          python scripts/check_batchnorm_backward.py
          --output /tmp/ai-journey-artifacts/batchnorm-backward.json
      - name: Run the predeclared transformer ablation
        run: >-
          python scripts/run_ablation.py
          --protocol config/day-31-learning-rate-ablation.json
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-31-ablation.json
      - name: Run the Day 32 hierarchical character model
        run: >-
          python scripts/run_day_32.py
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-32-wavenet.json
          --steps 4
          --batch-size 8
          --context-size 4
          --embedding-dim 4
          --hidden-dim 12
          --group-factors 2 2
          --overfit-examples 8
          --overfit-steps 40
          --minimum-overfit-improvement 0.5
      - name: Verify the Day 33 primitive WaveNet rebuild
        run: >-
          python scripts/run_day_33.py
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-33-wavenet-rebuild.json
          --steps 2
          --batch-size 8
          --context-size 4
          --embedding-dim 4
          --hidden-dim 12
          --group-factors 2 2
          --overfit-examples 8
          --overfit-steps 30
          --minimum-overfit-improvement 0.3
      - name: Certify the Day 33 rebuild reliability contract
        run: >-
          python scripts/certify_day_33.py
          --corpus data/day-19-demo-names.txt
          --output /tmp/ai-journey-artifacts/day-33-certification.json
          --examples 4
      - name: Train the pinned Tiny Shakespeare bigram baseline
        run: >-
          ai-journey-day-34
          --corpus /tmp/ai-journey-artifacts/tinyshakespeare.txt
          --download
          --output /tmp/ai-journey-artifacts/day-34-bigram.json
          --checkpoint /tmp/ai-journey-artifacts/day-34-bigram.pt
          --steps 2
          --batch-size 4
          --block-size 8
          --sample-tokens 16
      - name: Verify causal averaging equivalence and streaming
        run: >-
          ai-journey-day-35
          --output /tmp/ai-journey-artifacts/day-35-causal-average.json
          --batch-size 2
          --time 5
          --channels 3
      - name: Check deployment readiness
        run: >-
          python tools/deployment_readiness_check.py
          --root .
          --config config/deployment_readiness.json
          --output /tmp/deployment-readiness.json
      - name: Certify manual attention and matched head-count trials
        run: >-
          ai-journey-day-37
          --output /tmp/ai-journey-artifacts/day-37-certification.json
          --protocol config/day-37-head-count-ablation.json
          --corpus data/day-19-demo-names.txt
          --ablation-output /tmp/ai-journey-artifacts/day-37-head-count.json
      - name: Certify post-norm scaled dot-product attention
        run: >-
          ai-journey-day-37
          --output /tmp/ai-journey-artifacts/day-37-post-sdpa.json
          --backend sdpa
          --norm-placement post
