[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ajay-ai-journey"
version = "0.1.0"
description = "Executable Days 0-23 of a public-safe AI engineering learning journey"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<2",
  "matplotlib>=3.7,<4",
]

[tool.setuptools.packages.find]
where = ["src"]
