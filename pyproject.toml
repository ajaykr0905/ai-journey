[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ajay-ai-journey"
version = "0.1.0"
description = "Executable public-safe AI engineering experiments and evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<2",
  "matplotlib>=3.7,<4",
  "torch>=2.2,<3",
]

[project.scripts]
ai-journey-day-34 = "ai_journey.day34_cli:main"
ai-journey-day-35 = "ai_journey.day35_cli:main"
ai-journey-day-37 = "ai_journey.day37_cli:main"
ai-journey-day-38 = "ai_journey.day38_cli:main"
ai-journey-day-38-infer = "ai_journey.day38_inference_cli:main"
ai-journey-day-38-ablate = "ai_journey.day38_ablation:main"
ai-journey-serving-benchmark = "ai_journey.serving_benchmark:main"
ai-journey-serving-evidence = "ai_journey.serving_evidence_cli:main"
ai-journey-http-load = "ai_journey.http_load_cli:main"
ai-journey-tokenizer = "ai_journey.tokenizer_cli:main"
ai-journey-tokenizer-resume = "ai_journey.tokenizer_restart_cli:main"
ai-journey-tokenizer-compare = "ai_journey.day40_cli:main"
ai-journey-corpus-export = "ai_journey.parallel_export:main"
ai-journey-bpe-train = "ai_journey.bpe_train_cli:main"
ai-journey-bpe-infer = "ai_journey.bpe_infer_cli:main"
ai-journey-bpe-encode-benchmark = "ai_journey.bpe_benchmark:main"
ai-journey-bpe-model-compare = "ai_journey.bpe_model_cli:main"
ai-journey-bpe-model-verify = "ai_journey.bpe_model_verify:main"
ai-journey-lora-compare = "ai_journey.lora_cli:main"
