[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ajay-ai-journey"
version = "0.1.0"
description = "Executable public-safe AI engineering experiments and evidence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<2",
  "matplotlib>=3.7,<4",
  "torch>=2.2,<3",
]

[project.scripts]
ai-journey-day-34 = "ai_journey.day34_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
